 each obj contain 2 property name and age.

 <!DOCTYPE html>

    <script>

        
        let person = [{name:"Dev",age:25},{name:"Jay",age:26},{name:"Ved",age:24},]

    person.forEach(element => { console.log(element.name+" " +element.age)

    </script>
